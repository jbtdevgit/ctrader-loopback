<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Market Grid — signing you in…</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #0b0d12;
        --muted: #5b6472;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0d12;
          --fg: #e8ebf0;
          --muted: #9aa4b2;
          --accent: #60a5fa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 360px;
        text-align: center;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .spinner {
        width: 32px;
        height: 32px;
        margin: 0 auto 20px;
        border: 3px solid color-mix(in srgb, var(--muted) 30%, transparent);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a.button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
      .hidden {
        display: none;
      }
      code {
        font-size: 13px;
        color: var(--muted);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div id="working">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Signing you in…</h1>
        <p>Returning to the Market Grid app.</p>
        <p>
          Didn't return automatically?
          <a id="fallback" class="button" href="#">Open the app</a>
        </p>
      </div>
      <div id="failed" class="hidden">
        <h1>Login couldn't complete</h1>
        <p id="failMsg">No authorization code was returned. Please try signing in again from the app.</p>
      </div>
    </main>

    <script>
      // OAuth bridge for cTrader (ADR-0015). cTrader only allows http/https redirect URIs, so it
      // redirects here with ?code=… (or an error). This page bounces that straight into the app via the
      // marketgrid:// deep link, which the app's in-app browser is watching for. The app then exchanges
      // the code for tokens. No secrets are handled here — only the short-lived one-time code is relayed.
      (function () {
        "use strict";

        // MUST match OAUTH_DEEPLINK_RETURN_URL in the app (src/adapters/ctrader/oauth-token.ts).
        var DEEP_LINK = "marketgrid://oauth/callback";

        var params = new URLSearchParams(window.location.search);
        var code = params.get("code");
        var error = params.get("error") || params.get("errorCode");

        function showFailure(message) {
          document.getElementById("working").classList.add("hidden");
          var failed = document.getElementById("failed");
          if (message) document.getElementById("failMsg").textContent = message;
          failed.classList.remove("hidden");
        }

        if (error) {
          var desc = params.get("error_description") || params.get("description") || "";
          showFailure("cTrader reported: " + error + (desc ? " — " + desc : ""));
          return;
        }
        if (!code) {
          showFailure();
          return;
        }

        // Preserve every param cTrader sent (code, and state if present) when bouncing into the app.
        var target = DEEP_LINK + "?" + params.toString();
        var fallback = document.getElementById("fallback");
        fallback.setAttribute("href", target);

        // Try to open the app automatically. On mobile the OS hands the URL to the app; the fallback
        // button covers the case where the deep link doesn't fire.
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
